<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>WGC Field Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#26362B">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WGC">
<style>
  :root{
    --bg:#E7E1CA;
    --bg-panel:#F4F0E1;
    --forest:#26362B;
    --forest-dark:#182018;
    --brass:#B08D57;
    --brass-dark:#8C6B3B;
    --oxblood:#7B3B2E;
    --ink:#22261F;
    --ink-soft:#5B5E4F;
    --line:#C9C0A0;
    --good:#3E5C3A;
    --radius:10px;
    --shadow:0 2px 8px rgba(24,32,24,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(38,54,43,0.06) 1px, transparent 0);
    background-size:14px 14px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}

  .topbar{
    background:var(--forest);
    color:var(--bg-panel);
    padding:18px 18px 14px;
    border-bottom:3px solid var(--brass);
  }
  .topbar .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--brass);
    text-transform:uppercase;
  }
  .topbar h1{
    font-family:'Roboto Slab',serif;
    font-size:22px;
    margin:2px 0 0;
    font-weight:700;
    letter-spacing:0.01em;
  }

  main{flex:1;padding:16px 16px 90px;}

  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .card h2{
    font-family:'Roboto Slab',serif;
    font-size:16px;
    margin:0 0 10px;
    color:var(--forest);
  }
  .muted{color:var(--ink-soft);font-size:13px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:10px 0 4px;text-transform:uppercase;letter-spacing:0.04em;}
  select,input[type=text],input[type=date]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  input:focus,select:focus,button:focus{outline:2px solid var(--brass);outline-offset:1px;}

  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    transition:transform .05s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-primary{background:var(--forest);color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--forest-dark);}
  .btn-brass{background:var(--brass);color:var(--forest-dark);}
  .btn-brass:hover:not(:disabled){background:var(--brass-dark);}
  .btn-ghost{background:transparent;color:var(--forest);border:1px solid var(--forest);}
  .btn-danger{background:transparent;color:var(--oxblood);border:1px solid var(--oxblood);}
  .btn-small{padding:7px 10px;font-size:12px;}
  .row{display:flex;gap:8px;align-items:center;}
  .row > *{flex:1;}
  .btn-row{display:flex;gap:8px;margin-top:12px;}

  .session-option{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);border-radius:8px;
    padding:12px;margin-bottom:8px;background:#fff;cursor:pointer;
  }
  .session-option.checked{border-color:var(--forest);background:#EFEBD9;}
  .session-option.locked{cursor:default;}
  .session-option.select-all{border:1.5px solid var(--brass);background:#F6EFE0;}
  .session-option.select-all.checked{background:#EFE1C4;}
  .weekend-group{margin-bottom:14px;}
  .weekend-group:last-child{margin-bottom:0;}
  .session-option input{width:18px;height:18px;}
  .session-option .meta{flex:1;}
  .session-option .sday{font-weight:600;font-size:14px;}
  .session-option .sdate{font-size:12px;color:var(--ink-soft);}
  .tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;
    padding:3px 7px;border-radius:20px;text-transform:uppercase;
  }
  .tag-open{background:#DCEBD9;color:var(--good);}
  .tag-drawn{background:#F1E4D2;color:var(--brass-dark);}
  .tag-locked{background:#EAD9D3;color:var(--oxblood);}
  .tag-closed{background:#E3E3D8;color:var(--ink-soft);}
  .tag-auto-closed{background:#F3DCC9;color:var(--oxblood);}

  .ticket{
    display:flex;align-items:center;gap:12px;
    background:#fff;border:1px dashed var(--line);border-radius:8px;
    padding:10px 12px;margin-bottom:8px;position:relative;
  }
  .ticket .num{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;
    color:var(--forest);min-width:34px;text-align:center;
    background:var(--bg);border-radius:6px;padding:6px 0;
  }
  .ticket .who{flex:1;min-width:0;}
  .ticket .who .nm{font-weight:600;font-size:14px;}
  .ticket .who .as{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .ticket.done{border-style:solid;border-color:var(--good);}
  .ticket .assign-controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;width:100%;}
  .ticket .assign-controls select{flex:1;min-width:100px;}

  .tabbar{
    position:sticky;bottom:0;left:0;right:0;
    display:flex;background:var(--forest);border-top:3px solid var(--brass);
    max-width:640px;margin:0 auto;
  }
  .tabbar button{
    flex:1;background:none;color:#C9CBBE;border-radius:0;padding:10px 4px 8px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.05em;text-transform:uppercase;
  }
  .tabbar button .ic{display:block;font-size:17px;margin-bottom:2px;}
  .tabbar button.active{color:#fff;background:var(--forest-dark);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);}
  th{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.05em;}

  .toast{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    background:var(--forest-dark);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13px;box-shadow:var(--shadow);z-index:50;max-width:90%;text-align:center;
  }
  .list-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .list-row:last-child{border-bottom:none;}
  .empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:14px;}
  .pin-gate{text-align:center;padding:40px 10px;}
  .pin-gate input{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:0.3em;max-width:180px;margin:14px auto;}
  a.linklike{color:var(--forest);font-weight:600;cursor:pointer;text-decoration:underline;font-size:13px;}
  .stat-box{display:flex;gap:10px;margin-bottom:4px;}
  .stat-box .s{flex:1;background:var(--bg);border-radius:8px;padding:10px;text-align:center;}
  .stat-box .s .n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--forest);}
  .stat-box .s .l{font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.05em;}
  .badge-remove{background:var(--oxblood);color:#fff;border-radius:50%;width:22px;height:22px;padding:0;font-size:14px;line-height:1;}
  .section-divider{margin:22px 0 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:4px;}
  .loading{text-align:center;padding:40px;color:var(--ink-soft);}
  .rollcall{margin:-4px 0 10px;}
  .rollcall summary{list-style:none;cursor:pointer;color:var(--forest);font-weight:600;font-size:13px;text-decoration:underline;padding:2px 2px 6px;}
  .rollcall summary::-webkit-details-marker{display:none;}
  .rollcall table{margin-top:4px;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .rollcall th,.rollcall td{padding:6px 10px;}
  .rollcall td:first-child,.rollcall th:first-child{width:32px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .topbar-flex{display:flex;align-items:center;gap:12px;}
  .topbar .logo{width:48px;height:48px;flex:0 0 auto;object-fit:contain;}
  .map-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;}
  .map-overlay{position:fixed;inset:0;background:rgba(24,32,24,0.88);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;cursor:zoom-out;}
  .map-overlay img{max-width:100%;max-height:78vh;border-radius:10px;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,0.5);}
  .map-overlay .map-title{font-family:'Roboto Slab',serif;color:#F4F0E1;font-size:18px;font-weight:700;margin-bottom:10px;letter-spacing:0.03em;}
  .offline-banner{background:var(--oxblood);color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow);}
  .map-overlay .map-scroll{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;}
  .map-overlay img.wide{max-width:none;height:min(70vh,520px);width:auto;}
</style>
</head>

// ---------- storage helpers ----------
// ---------- storage backend ----------
// This app used to use Claude's window.storage, which requires viewers to be
// logged into Claude. It now talks to a free Google Apps Script Web App
// instead, so the register works for anyone with the link, no login needed.
// Deploy Code.gs as a Web App (see instructions in that file), then paste
// the resulting URL below.
const BACKEND_URL = "https://script.google.com/macros/s/AKfycby_FnmC7X-pPEH1FdpQIlLmcUnCrlBoLhB1ADlJjstimLUU-xnzN5nFHCwdevFqLtI/exec";

async function apiCall(action, payload){
  if(!BACKEND_URL || BACKEND_URL.indexOf("PASTE_YOUR") === 0){
    toast("Backend not configured yet — set BACKEND_URL in the code.");
    return null;
  }
  try{
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({action}, payload))
    });
    return await res.json();
  }catch(e){
    console.error("backend call failed", action, payload, e);
    return null;
  }
}
async function sget(key){
  const r = await apiCall("get", {key});
  if(!r){
    toast("⚠️ Couldn't reach the shared database — check your connection.");
    return null;
  }
  if(r.value === null || r.value === undefined) return null;
  try{ return JSON.parse(r.value); }catch(e){ return null; }
}
async function sgetBatch(keys){
  if(keys.length===0) return {};
  const r = await apiCall("batchGet", {keys});
  if(!r){
    toast("⚠️ Couldn't reach the shared database — check your connection.");
    return {};
  }
  const out = {};
  const values = r.values || {};
  Object.keys(values).forEach(k=>{
    const raw = values[k];
    if(raw === null || raw === undefined){ out[k] = null; return; }
    try{ out[k] = JSON.parse(raw); }catch(e){ out[k] = null; }
  });
  return out;
}
async function sbootstrap(){
  // One-shot startup fetch: core config + every current session in a single
  // network round trip, instead of a core fetch followed by a second fetch
  // for sessions once session-index is known.
  const r = await apiCall("bootstrap", {});
  if(!r || r.error){
    // Genuine failure to reach the backend — return null (not {}) so init()
    // can tell "couldn't load" apart from "sheet is legitimately empty" and
    // never overwrites real data with blank defaults because of a dropped request.
    return null;
  }
  const out = {};
  const values = r.values || {};
  Object.keys(values).forEach(k=>{
    const raw = values[k];
    if(raw === null || raw === undefined){ out[k] = null; return; }
    try{ out[k] = JSON.parse(raw); }catch(e){ out[k] = null; }
  });
  return out;
}
async function sset(key, val){
  const payload = {key, value: JSON.stringify(val)};
  // Config keys are PIN-protected on the backend; sessions stay open so
  // members can register and log bags without the PIN.
  if(/^(roster|properties|species|admin-pin|session-index)$/.test(key)) payload.pin = state.adminPin || "";
  const r = await apiCall("set", payload);
  const ok = !!(r && r.ok);
  if(!ok){
    toast("⚠️ Couldn't save — this change did NOT reach the shared database. Check your connection and try again.", 4500);
  }
  return ok;
}

function toast(msg, ms=2600){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
}

// Draw schedule: Sat AM draws Fri 7:00 PM (night before) · Sat PM & Sun AM draw Sat 2:00 PM.
// Registration for each session auto-closes 1 minute before its draw time.
function drawDateTime(s){
  const d = new Date(s.dateISO+"T12:00:00");
  if(s.day === "SATAM"){
    d.setDate(d.getDate()-1);
    d.setHours(19,0,0,0);
  } else if(s.day === "SATPM"){
    d.setHours(14,0,0,0);
  } else { // SUNAM — draws alongside Sat PM, the day before
    d.setDate(d.getDate()-1);
    d.setHours(14,0,0,0);
  }
  return d;
}
function registrationCloseTime(s){
  return new Date(drawDateTime(s).getTime() - 60*1000);
}
function isPastCloseTime(s){
  return new Date() >= registrationCloseTime(s);
}
function isRegistrationOpen(s){
  if(!s.active) return false;
  if(s.order && s.order.length) return false;
  if(s.forceOpen) return true;
  return !isPastCloseTime(s);
}
function fmtDateTime(d){
  return d.toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}

// ---------- weather (eastern Jamaica — St Thomas / Kingston) ----------
// Free, no-key Open-Meteo API. Falls back to the historical archive for past
// dates (used when logging bag counts after a shoot) and the forecast API
// for upcoming dates (used on the Draw page).
const WEATHER_LAT = 17.8814, WEATHER_LON = -76.5300; // Yallahs, St Thomas — eastern Jamaica reference point
function weatherIcon(code){
  if(code===0) return "☀️";
  if(code===1) return "🌤️";
  if(code===2) return "⛅";
  if(code===3) return "☁️";
  if(code===45||code===48) return "🌫️";
  if([51,53,55,56,57].includes(code)) return "🌦️";
  if([61,63,65,66,67,80,81,82].includes(code)) return "🌧️";
  if([95,96,99].includes(code)) return "⛈️";
  return "🌡️";
}
async function fetchWeatherForDate(dateISO){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateISO+"T12:00:00");
  const isPast = target < today;
  const base = isPast ? "https://archive-api.open-meteo.com/v1/archive" : "https://api.open-meteo.com/v1/forecast";
  const url = `${base}?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&daily=weathercode,temperature_2m_max&timezone=America%2FJamaica&start_date=${dateISO}&end_date=${dateISO}`;
  try{
    const res = await fetch(url);
    const data = await res.json();
    if(data && data.daily && data.daily.time && data.daily.time.length){
      return { code: data.daily.weathercode[0], tMax: Math.round(data.daily.temperature_2m_max[0]) };
    }
    return null;
  }catch(e){
    console.error("weather fetch failed", dateISO, e);
    return null;
  }
}
function ensureWeather(dateISO){
  if(state.weatherCache[dateISO] !== undefined) return;
  state.weatherCache[dateISO] = "loading";
  fetchWeatherForDate(dateISO).then(w=>{
    state.weatherCache[dateISO] = w; // null on failure — cached so we don't hammer retries
    render();
  });
}
function weatherChipHtml(dateISO){
  ensureWeather(dateISO);
  const w = state.weatherCache[dateISO];
  if(w === "loading") return `⏳ <span style="font-size:11px;">loading</span>`;
  if(!w) return `— <span style="font-size:11px;">n/a</span>`;
  return `${weatherIcon(w.code)} ${w.tMax}°C`;
}


// ---------- property maps ----------
// Stand-layout images, embedded so they work offline in the field.

function propertyMapsRowHtml(names){
  const pool = (names && names.length) ? names : state.properties.filter(p=>p.active).map(p=>p.name);
  const withMaps = pool.filter(n=>PROPERTY_MAPS[n]);
  if(withMaps.length===0) return "";
  return `<div class="map-row">${withMaps.map(n=>`<button type="button" class="btn-ghost btn-small" data-map="${escAttr(n)}">🗺 ${esc(n)}</button>`).join("")}</div>`;
}
function propertyMapsCardHtml(){
  const row = propertyMapsRowHtml(null);
  if(!row) return "";
  return `<div class="card"><h2>Property maps</h2><p class="muted">Tap a property to see its stand layout.</p>${row}</div>`;
}
function showMap(name){
  const mapSrc = PROPERTY_MAPS[name];
  if(!mapSrc) return;
  const ov = document.createElement("div");
  ov.className = "map-overlay";
  ov.innerHTML = `<div class="map-title">${esc(name)}</div><div class="map-scroll"><img src="${mapSrc}" alt="Stand map of ${escAttr(name)}"></div><div style="color:#E7E1CA;margin-top:10px;font-size:13px">Wide maps scroll sideways · tap outside the map to close</div>`;
  const img = ov.querySelector("img");
  const markWide = ()=>{ if(img.naturalWidth > img.naturalHeight*1.6) img.classList.add("wide"); };
  if(img.complete) markWide(); else img.addEventListener("load", markWide);
  ov.querySelector(".map-scroll").addEventListener("click", (e)=>e.stopPropagation());
  ov.addEventListener("click", ()=>ov.remove());
  document.body.appendChild(ov);
}
document.addEventListener("click", (e)=>{
  const mb = e.target.closest("[data-map]");
  if(mb){ e.preventDefault(); showMap(mb.dataset.map); }
});

// ---------- init / seeding ----------
async function init(){
  let core = await sbootstrap();

  if(core === null){
    // Couldn't reach the backend. Fall back to the last successful load so
    // the register still opens in the field (read-only); otherwise show the
    // retry screen. Never seed/write defaults on a failed load.
    const cached = readBootstrapCache();
    if(cached){
      core = cached;
      state.offlineMode = true;
    } else {
      state.loaded = false;
      state.loadFailed = true;
      render();
      return;
    }
  } else {
    state.offlineMode = false;
    saveBootstrapCache(core);
  }
  state.loadFailed = false;

  let roster = core["roster"];
  if(!roster){ roster = SEED_ROSTER.slice(); await sset("roster", roster); }
  else if(roster.length && typeof roster[0] === "string"){
    // migrate old plain-name format
    roster = roster.map(n => ({name:n, junior: JUNIOR_NAMES.has(n)}));
    await sset("roster", roster);
  }
  state.roster = roster;

  let props = core["properties"];
  if(!props){ props = SEED_PROPERTIES.map(p=>({...p, active:true})); await sset("properties", props); }
  else if(props.length && props[0].active === undefined){
    props = props.map(p=>({...p, active:true}));
    await sset("properties", props);
  }
  state.properties = props;

  let species = core["species"];
  if(!species){ species = SEED_SPECIES.slice(); await sset("species", species); }
  state.species = species;

  let idx = core["session-index"];
  if(!idx){ idx = []; await sset("session-index", idx); }
  state.sessionIndex = idx;

  let pin = core["admin-pin"];
  if(!pin){ pin = "2026"; await sset("admin-pin", pin); }
  state.adminPin = pin;

  // Sessions came back in the same bootstrap response — no separate request needed.
  state.sessionIndex.forEach(id=>{
    const s = core["session:"+id];
    if(s) state.sessions[id] = s;
  });
  // Safety net: catches anything the bootstrap response somehow missed.
  await loadAllSessions();
  state.loaded = true;
  render();
}

async function loadAllSessions(){
  const missing = state.sessionIndex.filter(id => !state.sessions[id]);
  if(missing.length === 0) return;
  const results = await sgetBatch(missing.map(id => "session:"+id));
  missing.forEach(id => {
    const s = results["session:"+id];
    if(s) state.sessions[id] = s;
  });
}
async function saveSession(s){
  state.sessions[s.id] = s;
  await sset("session:"+s.id, s);
}

function sessionsSorted(){
  return state.sessionIndex.map(id=>state.sessions[id]).filter(Boolean)
    .sort((a,b)=> a.dateISO===b.dateISO ? a.day.localeCompare(b.day) : a.dateISO.localeCompare(b.dateISO));
}
function sessionStatus(s){
  if(s.locked) return "locked";
  if(s.order && s.order.length) return "drawn";
  if(!s.active) return "closed";
  if(isPastCloseTime(s) && !s.forceOpen) return "auto-closed";
  return "open";
}

// ---------- bag count helpers ----------
function bagTotal(counts){
  if(!counts) return 0;
  return Object.values(counts).reduce((a,b)=>a+(Number(b)||0), 0);
}
function bagBreakdown(counts){
  if(!counts) return "";
  return Object.entries(counts).filter(([,n])=>Number(n)>0).map(([sp,n])=>`${sp} ${n}`).join(" · ");
}

// ---------- tabs ----------
document.addEventListener("click", (e)=>{
  const tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){ state.tab = tabBtn.dataset.tab; render(); }
});

function render(){
  document.querySelectorAll(".tabbar button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === state.tab);
  });
  const titles = {register:"Register to Shoot", draw:"Live Draw", rollcall:"Roll Call", results:"Draw Results", dashboard:"Season Stats", setup:"Club Setup"};
  document.getElementById("topTitle").textContent = titles[state.tab] || "Field Register";

  if(!state.loaded){
    if(state.loadFailed){
      document.getElementById("view").innerHTML = `<div class="card">
        <div class="empty">⚠️ Couldn't reach the shared database. Nothing was changed or lost — this is just a failed connection.<br><br>Check your internet connection, then try again.</div>
        <div class="btn-row" style="margin-top:12px"><button class="btn-primary" id="retryLoad" style="width:100%">Retry</button></div>
      </div>`;
      const retryBtn = document.getElementById("retryLoad");
      if(retryBtn) retryBtn.addEventListener("click", ()=>{
        document.getElementById("view").innerHTML = `<div class="loading">Loading register…</div>`;
        init();
      });
    }
    return;
  }
  const view = document.getElementById("view");
  if(state.tab === "register") view.innerHTML = renderRegister();
  else if(state.tab === "draw") view.innerHTML = state.adminUnlocked ? renderDraw() : renderPinGate("draw");
  else if(state.tab === "rollcall") view.innerHTML = state.adminUnlocked ? renderRollCall() : renderPinGate("rollcall");
  else if(state.tab === "results") view.innerHTML = renderResults();
  else if(state.tab === "dashboard") view.innerHTML = renderDashboard();
  else if(state.tab === "setup") view.innerHTML = state.adminUnlocked ? renderSetup() : renderPinGate("setup");
  if(state.offlineMode){
    view.insertAdjacentHTML("afterbegin", `<div class="offline-banner">\u{1F4E1} Offline — showing the last synced data. Changes can't be saved right now. Tap here to retry.</div>`);
  }
  attachHandlers();
}

function renderPinGate(returnTab){
  return `
  <div class="card pin-gate">
    <h2>Admin PIN required</h2>
    <p class="muted">This area runs the draw and edits club data. Ask your club admin for the PIN.</p>
    <input type="text" inputmode="numeric" id="pinInput" maxlength="8" placeholder="••••">
    <div class="btn-row" style="justify-content:center">
      <button class="btn-primary" id="pinSubmit" data-return="${returnTab}">Unlock</button>
    </div>
  </div>`;
}

// ---------- REGISTER TAB ----------
function renderRegister(){
  const open = sessionsSorted().filter(isRegistrationOpen);
  const selectedName = state.selectedRegName || "";
  const isGuestSelection = selectedName === "__guest__";
  const anyGuestSessionOpen = open.some(s=>s.guestsAllowed);

  const rosterOpts = state.roster.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(m=>`<option value="${escAttr(m.name)}" ${m.name===selectedName?"selected":""}>${esc(m.name)}${m.junior?" (Jr)":""}</option>`).join("");
  const hostOpts = rosterOpts;

  // Which of the currently open sessions has this shooter already registered for?
  const registeredIds = new Set();
  if(selectedName && !isGuestSelection){
    open.forEach(s => { if(s.registrations.includes(selectedName)) registeredIds.add(s.id); });
  }

  const byWeekend = {};
  open.forEach(s=>{ (byWeekend[s.weekendLabel] = byWeekend[s.weekendLabel] || []).push(s); });

  const groupsHtml = Object.keys(byWeekend).map(wk=>{
    const sess = byWeekend[wk].slice().sort((a,b)=>a.dateISO.localeCompare(b.dateISO));
    const remaining = sess.filter(s=>!registeredIds.has(s.id) && !(isGuestSelection && !s.guestsAllowed));

    if(selectedName && !isGuestSelection && remaining.length===0){
      return `<div class="weekend-group"><div class="session-option locked checked">
        <div class="meta"><div class="sday">${wk}</div><div class="sdate">You're registered for every open session this weekend.</div></div>
        <span class="tag tag-drawn">✓ All set</span>
      </div></div>`;
    }

    const selectAll = remaining.length > 1 ? `
      <label class="session-option select-all" data-weekend="${escAttr(wk)}">
        <input type="checkbox" class="selectAllCheck" data-weekend="${escAttr(wk)}">
        <div class="meta"><div class="sday">Select all ${remaining.length} remaining sessions — ${wk}</div><div class="sdate">Shooting the whole weekend</div></div>
      </label>` : "";

    const rows = sess.map(s=>{
      if(registeredIds.has(s.id)){
        return `<div class="session-option locked checked">
          <div class="meta">
            <div class="sday">${dayLabel(s.day)} · ${s.weekendLabel}</div>
            <div class="sdate">${fmtDate(s.dateISO)} · Closes ${fmtDateTime(registrationCloseTime(s))}</div>
          </div>
          <span class="tag tag-drawn">✓ Registered</span>
        </div>${rollCallHtml(s)}`;
      }
      if(isGuestSelection && !s.guestsAllowed){
        return `<div class="session-option locked">
          <div class="meta">
            <div class="sday">${dayLabel(s.day)} · ${s.weekendLabel}</div>
            <div class="sdate">${fmtDate(s.dateISO)} · Guests not allowed for this session</div>
          </div>
        </div>`;
      }
      return `<label class="session-option" data-session="${s.id}" data-weekend="${escAttr(wk)}">
        <input type="checkbox" class="regCheck" value="${s.id}">
        <div class="meta">
          <div class="sday">${dayLabel(s.day)} · ${s.weekendLabel}</div>
          <div class="sdate">${fmtDate(s.dateISO)} · ${s.registrations.length} registered · Closes ${fmtDateTime(registrationCloseTime(s))}</div>
        </div>
      </label>${rollCallHtml(s)}`;
    }).join("");
    return `<div class="weekend-group">${selectAll}${rows}</div>`;
  }).join("");

  return `
  <div class="card">
    <h2>Who's shooting?</h2>
    <label>Your name</label>
    <select id="regName">
      <option value="">— Select your name —</option>
      ${anyGuestSessionOpen ? `<option value="__guest__" ${isGuestSelection?"selected":""}>Guest / not on roster</option>` : ""}
      ${rosterOpts}
    </select>
    <div id="guestFields" style="display:${isGuestSelection?"block":"none"}">
      <label>Guest name</label>
      <input type="text" id="guestName" placeholder="Full name">
      <label>Hosted by</label>
      <select id="guestHost"><option value="">— Select host —</option>${hostOpts}</select>
    </div>
  </div>

  <div class="card">
    <h2>Open sessions</h2>
    ${open.length===0 ? `<div class="empty">No sessions are open for registration right now.<br>Check back once the club admin opens the next weekend.</div>` : groupsHtml}
    ${open.length>0 ? `<div class="btn-row"><button class="btn-primary" id="submitReg" style="width:100%">Submit registration</button></div>` : ""}
  </div>
  ${propertyMapsCardHtml()}`;
}

function rollCallHtml(s){
  if(!s.registrations || s.registrations.length===0){
    return `<div class="muted" style="padding:2px 2px 8px">No one registered yet.</div>`;
  }
  // Preserve each shooter's original registration-order number (their position
  // in s.registrations, the order they signed up), then list alphabetically
  // for easy lookup during roll call.
  const withNum = s.registrations.map((name,idx)=>({name, num: idx+1}));
  withNum.sort((a,b)=>a.name.localeCompare(b.name));
  const rows = withNum.map(r=>`<tr><td>${r.num}</td><td>${esc(r.name)}</td></tr>`).join("");
  return `<details class="rollcall">
    <summary>${s.registrations.length} registered — view names for roll call</summary>
    <table><thead><tr><th>#</th><th>Name</th></tr></thead><tbody>${rows}</tbody></table>
  </details>`;
}
function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function syncSelectAll(weekend){
  if(!weekend) return;
  const all = document.querySelectorAll(`.session-option[data-session][data-weekend="${cssEsc(weekend)}"] input`);
  const master = document.querySelector(`.selectAllCheck[data-weekend="${cssEsc(weekend)}"]`);
  if(!master || all.length===0) return;
  master.checked = Array.from(all).every(i=>i.checked);
  master.closest(".select-all").classList.toggle("checked", master.checked);
}

async function submitRegistration(){
  const nameSel = document.getElementById("regName").value;
  let name = nameSel;
  if(nameSel === "__guest__"){
    const gname = document.getElementById("guestName").value.trim();
    const host = document.getElementById("guestHost").value;
    if(!gname || !host){ toast("Enter guest name and host to continue."); return; }
    // Guest registration is admin-controlled — a member can fill this in, but
    // it won't submit without the admin PIN, so an admin has to be the one to
    // actually approve and add it.
    const pin = prompt("Admin PIN required to add a guest:");
    if(pin === null) return; // cancelled
    if(pin !== state.adminPin){ toast("Incorrect PIN — guest not added."); return; }
    name = `${gname.toUpperCase()} (Guest of ${host})`;
  } else if(!nameSel){
    toast("Select your name first.");
    return;
  }
  const checks = Array.from(document.querySelectorAll(".regCheck:checked")).map(c=>c.value);
  if(checks.length===0){ toast("Pick at least one session."); return; }

  let added = 0;
  const closedOut = [];
  for(const id of checks){
    // Re-fetch fresh from the shared database right before writing — this catches
    // both the close time passing and an admin manually closing it moments ago,
    // even if this page had already been open with it showing as available.
    const fresh = await sget("session:"+id);
    if(!fresh){ closedOut.push(id); continue; }
    state.sessions[id] = fresh;
    if(!isRegistrationOpen(fresh)){
      closedOut.push(fresh);
      continue;
    }
    if(!fresh.registrations.includes(name)){
      fresh.registrations.push(name);
      await saveSession(fresh);
    }
    added++;
  }

  if(added>0){
    toast(`Registered ${name.split(" (")[0]} for ${added} session${added>1?"s":""}.`);
  }
  if(closedOut.length>0){
    const labels = closedOut.map(s => typeof s === "string" ? "a session" : `${dayLabel(s.day)} · ${s.weekendLabel}`).join(", ");
    toast(`Registration just closed for: ${labels}. Not added — check with the club admin if this was in error.`, 5000);
  }
  state.selectedRegName = "";
  render();
}

// ---------- DRAW TAB ----------
function renderDraw(){
  const pending = sessionsSorted().filter(s=>!s.locked && (!s.order || !s.order.length) && !s.rollCallLocked && s.registrations.length>0);
  const sessions = sessionsSorted().filter(s=>!s.locked && (s.rollCallLocked || (s.order && s.order.length)));
  const sel = state.drawSessionId && state.sessions[state.drawSessionId] ? state.sessions[state.drawSessionId] : (sessions[0]||null);
  if(sel) state.drawSessionId = sel.id;
  const options = sessions.map(s=>`<option value="${s.id}" ${sel && s.id===sel.id?"selected":""}>${dayLabel(s.day)} · ${s.weekendLabel} · ${fmtDate(s.dateISO)} (${s.registrations.length})</option>`).join("");

  let body = `<div class="empty">No sessions ready to draw yet. Complete roll call for a session first — it'll show up here once locked.</div>`;
  if(sel){
    const status = sessionStatus(sel);
    const drawn = !!(sel.order && sel.order.length);
    body = `
    <div class="stat-box">
      <div class="s"><div class="n">${sel.registrations.length}</div><div class="l">Registered</div></div>
      <div class="s"><div class="n">${drawn ? Object.keys(sel.assignments||{}).length : "—"}</div><div class="l">Assigned</div></div>
      <div class="s"><div class="n">${status}</div><div class="l">Status</div></div>
      <div class="s"><div class="n" style="font-size:16px">${weatherChipHtml(sel.dateISO)}</div><div class="l">Forecast</div></div>
    </div>
    <div class="muted" style="margin-bottom:4px">Scheduled draw ${fmtDateTime(drawDateTime(sel))} · Registration ${isRegistrationOpen(sel)?"closes":"closed"} ${fmtDateTime(registrationCloseTime(sel))}${sel.forceOpen && isPastCloseTime(sel) ? " · Reopened for late requests" : ""}</div>
    <div class="muted" style="margin-bottom:10px">${sel.availableProperties ? `${sel.availableProperties.length} propert${sel.availableProperties.length===1?"y":"ies"} available this weekend` : "No property list saved for this weekend — showing all active properties"}</div>
    ${propertyMapsRowHtml(sel.availableProperties)}`;

    if(!drawn){
      const earlier = earlierUndrawnSessions(sel);
      if(earlier.length>0){
        body += `<div class="muted" style="margin-bottom:10px;color:var(--oxblood)">⚠ Out of order: ${earlier.map(x=>`${dayLabel(x.day)} · ${x.weekendLabel}`).join(", ")} ${earlier.length>1?"haven't":"hasn't"} been drawn yet. You'll be asked to confirm before proceeding.</div>`;
      }
      body += `<div class="btn-row"><button class="btn-primary" id="runDraw" style="width:100%" ${sel.registrations.length===0?"disabled":""}>Run the draw (${sel.registrations.length} shooters)</button></div>`;
    } else {
      const taken = {}; // property -> Set of stand numbers used in this session
      Object.values(sel.assignments||{}).forEach(a=>{
        if(a && a.property){ (taken[a.property] = taken[a.property]||new Set()).add(String(a.stand)); }
      });
      let sawJunior = false;
      body += sel.order.map((name,i)=>{
        const jr = isJuniorName(name);
        let divider = "";
        if(jr && !sawJunior){ divider = `<div class="section-divider">Junior members draw last</div>`; sawJunior = true; }
        const a = (sel.assignments||{})[name];
        if(a){
          return `${divider}<div class="ticket done">
            <div class="num">${i+1}</div>
            <div class="who"><div class="nm">${esc(name)}${jr?' <span class="tag tag-drawn">Jr</span>':''}</div><div class="as">${esc(a.property)} · Stand ${a.stand}</div></div>
            <button class="btn-ghost btn-small editAssign" data-name="${escAttr(name)}">Edit</button>
          </div>`;
        }
        const availableSet = sel.availableProperties ? new Set(sel.availableProperties) : null;
        const propOpts = state.properties
          .filter(p => p.active && (!availableSet || availableSet.has(p.name)))
          .map(p=>`<option value="${escAttr(p.name)}">${esc(p.name)} (${standList(p).length})</option>`).join("");
        return `${divider}<div class="ticket" data-pending="${escAttr(name)}">
          <div class="num">${i+1}</div>
          <div class="who">
            <div class="nm">${esc(name)}${jr?' <span class="tag tag-drawn">Jr</span>':''}</div>
            <div class="assign-controls">
              <select class="propSel"><option value="">Property…</option>${propOpts}</select>
              <select class="standSel"><option value="">Stand…</option></select>
              <button class="btn-brass btn-small confirmAssign" data-name="${escAttr(name)}">Confirm</button>
            </div>
          </div>
        </div>`;
      }).join("");
      body += `<div class="btn-row">
        <button class="btn-ghost btn-small" id="reshuffle">Re-shuffle order</button>
        <button class="btn-primary" id="lockSession" style="flex:1">Lock session</button>
      </div>`;
      window.__taken = taken;
    }
  }

  return `
  <div class="card">
    <h2>Choose session</h2>
    ${sessions.length ? `<select id="drawSessionSel">${options}</select>` : `<div class="empty">No sessions available.</div>`}
    ${pending.length ? `<div class="muted" style="margin-top:10px">${pending.length} session${pending.length>1?"s":""} waiting on roll call: ${pending.map(s=>`${dayLabel(s.day)} · ${s.weekendLabel}`).join(", ")}. Lock roll call for ${pending.length>1?"them":"it"} first.</div>` : ""}
  </div>
  <div class="card">${body}</div>`;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function earlierUndrawnSessions(s){
  // Chronological order across the whole season (this naturally covers "same
  // weekend" ordering too, since weekend sessions sort within it).
  const all = sessionsSorted();
  const idx = all.findIndex(x=>x.id===s.id);
  if(idx<0) return [];
  return all.slice(0, idx).filter(x =>
    x.registrations.length>0 && (!x.order || x.order.length===0) && !x.locked
  );
}
async function runDraw(){
  const s = state.sessions[state.drawSessionId];
  if(!s || s.registrations.length===0) return;
  const earlier = earlierUndrawnSessions(s);
  if(earlier.length>0){
    const list = earlier.map(x=>`${dayLabel(x.day)} · ${x.weekendLabel} (${fmtDate(x.dateISO)})`).join("\n");
    const ok = confirm(`These earlier sessions haven't been drawn yet:\n\n${list}\n\nDraw ${dayLabel(s.day)} · ${s.weekendLabel} out of order anyway?`);
    if(!ok) return;
  }
  const ordinary = s.registrations.filter(n => !isJuniorName(n));
  const juniors  = s.registrations.filter(n => isJuniorName(n));
  const order = shuffle(ordinary).concat(shuffle(juniors));
  s.order = order;
  s.assignments = {};
  s.drawnAt = new Date().toISOString();
  await saveSession(s);
  toast("Draw order set.");
  render();
}
async function reshuffleDraw(){
  const s = state.sessions[state.drawSessionId];
  if(!s) return;
  if(Object.keys(s.assignments||{}).length > 0){
    if(!confirm("Some stands are already assigned. Re-shuffling clears all assignments. Continue?")) return;
  }
  await runDraw();
}
async function confirmAssign(name){
  const s = state.sessions[state.drawSessionId];
  const ticket = document.querySelector(`.ticket[data-pending="${cssEsc(name)}"]`);
  if(!ticket) return;
  const prop = ticket.querySelector(".propSel").value;
  const stand = ticket.querySelector(".standSel").value;
  if(!prop || !stand){ toast("Pick both a property and a stand."); return; }
  s.assignments = s.assignments || {};
  s.assignments[name] = {property: prop, stand: stand};
  await saveSession(s);
  render();
}
async function editAssign(name){
  const s = state.sessions[state.drawSessionId];
  delete s.assignments[name];
  await saveSession(s);
  render();
}
async function lockSession(){
  const s = state.sessions[state.drawSessionId];
  const unassigned = s.order.filter(n => !(s.assignments||{})[n]);
  if(unassigned.length>0){
    const list = unassigned.join(", ");
    const ok = confirm(`These ${unassigned.length} hunter(s) don't have a stand assigned yet:\n\n${list}\n\nThis is normal if a stand was released and never re-claimed. Lock the session anyway?`);
    if(!ok) return;
  }
  s.locked = true;
  s.active = false;
  await saveSession(s);
  toast("Session locked. Results are final.");
  state.tab = "results";
  render();
}
function cssEsc(s){ return String(s).replace(/(["\\])/g,'\\$1'); }

// ---------- ROLL CALL TAB ----------
function renderRollCall(){
  const sessions = sessionsSorted().filter(s=>(!s.order || !s.order.length) && !s.locked);
  const sel = state.rollcallSessionId && state.sessions[state.rollcallSessionId] && sessions.some(s=>s.id===state.rollcallSessionId)
    ? state.sessions[state.rollcallSessionId] : (sessions[0]||null);
  if(sel) state.rollcallSessionId = sel.id;
  const options = sessions.map(s=>`<option value="${s.id}" ${sel && s.id===sel.id?"selected":""}>${dayLabel(s.day)} · ${s.weekendLabel} · ${fmtDate(s.dateISO)} (${s.registrations.length})${s.rollCallLocked?" — locked":""}</option>`).join("");

  if(!sel){
    return `<div class="card"><div class="empty">No sessions ready for roll call.<br>Sessions appear here once they have registrations and haven't been drawn yet.</div></div>`;
  }

  const locked = !!sel.rollCallLocked;
  const registered = sel.registrations.slice();

  const rows = registered.map((name,i)=>{
    const jr = isJuniorName(name);
    return `<div class="ticket">
      <div class="num">${i+1}</div>
      <div class="who">
        <div class="nm">${esc(name)}${jr?' <span class="tag tag-drawn">Jr</span>':''}</div>
      </div>
      ${locked ? "" : `<button class="btn-danger btn-small removeAbsent" data-name="${escAttr(name)}">Not present</button>`}
    </div>`;
  }).join("") || `<div class="empty">No one registered for this session yet.</div>`;

  const rosterOpts = state.roster.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .filter(m=>!registered.includes(m.name))
    .map(m=>`<option value="${escAttr(m.name)}">${esc(m.name)}${m.junior?" (Jr)":""}</option>`).join("");
  const hostOpts = state.roster.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(m=>`<option value="${escAttr(m.name)}">${esc(m.name)}</option>`).join("");

  const addBlock = locked ? "" : `
    <div class="section-divider">Add a late-comer</div>
    <label>Name</label>
    <select id="rollcallAddName">
      <option value="">— Select name —</option>
      ${sel.guestsAllowed ? `<option value="__guest__">Guest / not on roster</option>` : ""}
      ${rosterOpts}
    </select>
    <div id="rollcallGuestFields" style="display:none">
      <label>Guest name</label>
      <input type="text" id="rollcallGuestName" placeholder="Full name">
      <label>Hosted by</label>
      <select id="rollcallGuestHost"><option value="">— Select host —</option>${hostOpts}</select>
    </div>
    <div class="btn-row"><button class="btn-brass" id="rollcallAdd" style="width:100%">Add to roll call</button></div>`;

  return `
  <div class="card">
    <h2>Choose session</h2>
    ${sessions.length ? `<select id="rollcallSessionSel">${options}</select>` : ""}
    <div class="muted" style="margin:10px 0 4px">
      ${locked
        ? "Roll call locked — this list is what the draw will run against. Unlock to make more changes."
        : "Mark anyone who isn't present as \"Not present,\" and add any late-comers below. Lock roll call when everyone's accounted for — that finalizes the list the draw will use."}
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="toggleRollCallLock" style="width:100%">${locked ? "Unlock roll call" : "Lock roll call"}</button>
    </div>
  </div>
  <div class="card">
    <h2>${registered.length} checked in</h2>
    ${rows}
    ${addBlock}
  </div>`;
}
// Always resolve the session these roll call actions act on from the visible
// dropdown itself, not from separately-tracked state — the two can drift
// apart across re-renders and cause an action to silently fire on the wrong
// session while the screen still shows the one the admin picked.
function currentRollCallSessionId(){
  const sel = document.getElementById("rollcallSessionSel");
  const id = (sel && sel.value) ? sel.value : state.rollcallSessionId;
  if(id) state.rollcallSessionId = id; // keep state in sync for anything else that reads it
  return id;
}
async function markAbsent(name){
  const s = state.sessions[currentRollCallSessionId()];
  if(!s) return;
  if(!confirm(`Remove ${name.split(" (")[0]} as not present? This removes them from this session's registration. This can't be undone.`)) return;
  s.registrations = (s.registrations||[]).filter(n=>n!==name);
  await saveSession(s);
  toast(`Removed ${name.split(" (")[0]}.`);
  render();
}
async function addToRollCall(){
  const s = state.sessions[currentRollCallSessionId()];
  if(!s) return;
  const nameSel = document.getElementById("rollcallAddName").value;
  let name = nameSel;
  if(nameSel === "__guest__"){
    const gname = document.getElementById("rollcallGuestName").value.trim();
    const host = document.getElementById("rollcallGuestHost").value;
    if(!gname || !host){ toast("Enter guest name and host to continue."); return; }
    name = `${gname.toUpperCase()} (Guest of ${host})`;
  } else if(!nameSel){
    toast("Select a name first.");
    return;
  }
  s.registrations = s.registrations || [];
  if(s.registrations.includes(name)){ toast("Already checked in."); return; }
  s.registrations.push(name);
  await saveSession(s);
  toast(`Added ${name.split(" (")[0]} to roll call.`);
  render();
}
async function toggleRollCallLock(){
  const s = state.sessions[currentRollCallSessionId()];
  if(!s) return;
  if(!s.rollCallLocked && s.registrations.length===0){ toast("No one's checked in yet."); return; }
  s.rollCallLocked = !s.rollCallLocked;
  await saveSession(s);
  toast(s.rollCallLocked ? "Roll call locked — ready for the draw." : "Roll call unlocked.");
  render();
}

// ---------- RESULTS TAB ----------
function renderResults(){
  const sessions = sessionsSorted().filter(s=>s.order && s.order.length);
  if(sessions.length===0) return `<div class="card"><div class="empty">No draws have been run yet.</div></div>`;
  const sel = state.resultsSessionId && state.sessions[state.resultsSessionId] ? state.sessions[state.resultsSessionId] : sessions[sessions.length-1];
  state.resultsSessionId = sel.id;
  const options = sessions.map(s=>`<option value="${s.id}" ${s.id===sel.id?"selected":""}>${dayLabel(s.day)} · ${s.weekendLabel} · ${fmtDate(s.dateISO)}</option>`).join("");
  const bags = sel.bags || {};
  const notShooting = sel.notShooting || {};

  const rows = sel.order.map((name,i)=>{
    const a = (sel.assignments||{})[name];
    const didNotShoot = !!notShooting[name];
    const counts = bags[name];
    const total = bagTotal(counts);
    const breakdown = bagBreakdown(counts);
    const birdsCell = didNotShoot
      ? `<span class="muted">Did not shoot</span>`
      : (total>0 ? `<b>${total}</b>${breakdown?`<div class="muted" style="font-size:11px">${esc(breakdown)}</div>`:""}` : `<span class="muted">—</span>`);
    return `<tr><td>${i+1}</td><td>${esc(name)}</td><td>${a?esc(a.property):"—"}</td><td>${a?a.stand:"—"}</td>
      <td>${birdsCell}</td></tr>`;
  }).join("");

  const isLocked = sessionStatus(sel)==='locked';
  const selectedBagName = state.selectedBagName || "";
  const nameOpts = sel.order.map(n=>{
    const logged = bags[n] || notShooting[n];
    return `<option value="${escAttr(n)}" ${n===selectedBagName?"selected":""}>${esc(n)}${logged?" ✓":""}</option>`;
  }).join("");
  const speciesInputs = state.species.map(sp=>`
    <div>
      <label>${esc(sp)}</label>
      <input type="text" inputmode="numeric" class="bagInput" data-species="${escAttr(sp)}" placeholder="0">
    </div>`).join("");

  const wasNotShooting = selectedBagName ? !!notShooting[selectedBagName] : false;

  // --- Change/release stand: fully independent card, own name selection,
  // no connection to the did-not-shoot stats checkbox above. ---
  const selectedStandName = state.selectedStandName || "";
  const standNameOpts = sel.order.map(n=>`<option value="${escAttr(n)}" ${n===selectedStandName?"selected":""}>${esc(n)}</option>`).join("");
  const chosenAssign = selectedStandName ? (sel.assignments||{})[selectedStandName] : null;
  const takenByProp = {};
  Object.entries(sel.assignments||{}).forEach(([nm,a])=>{
    if(!a || nm===selectedStandName) return;
    (takenByProp[a.property] = takenByProp[a.property]||new Set()).add(String(a.stand));
  });
  window.__resultsTaken = takenByProp;
  const availableSet = sel.availableProperties ? new Set(sel.availableProperties) : null;
  const propOpts = state.properties
    .filter(p => p.active && (!availableSet || availableSet.has(p.name)))
    .map(p=>`<option value="${escAttr(p.name)}">${esc(p.name)} (${standList(p).length})</option>`).join("");

  const standCard = `
  <div class="card">
    <h2>Change or release a stand</h2>
    <p class="muted">Move to a different available stand, or release a stand back into the pool if that hunter's decided not to shoot. First come, first served — no two hunters can hold the same stand.</p>
    ${propertyMapsRowHtml(sel.availableProperties)}
    <label>Name</label>
    <select id="standName"><option value="">— Select name —</option>${standNameOpts}</select>
    ${selectedStandName ? `
      <p class="muted" style="margin:8px 0">Currently: ${chosenAssign ? `<b>${esc(chosenAssign.property)} · Stand ${chosenAssign.stand}</b>` : "Not assigned"}</p>
      <select id="resultsStandProp"><option value="">Property…</option>${propOpts}</select>
      <select id="resultsStandStand"><option value="">Stand…</option></select>
      <div class="btn-row"><button class="btn-brass btn-small" id="updateStand" style="width:100%">Change to this stand</button></div>
      ${chosenAssign ? `<div class="btn-row"><button class="btn-ghost btn-small" id="releaseStand" style="width:100%">Not shooting — release this stand</button></div>` : ""}
    ` : ""}
  </div>`;

  return `
  ${isLocked ? `
  <div class="card">
    <h2>Log your bag <span class="muted" style="font-weight:400;font-size:13px">· ${sel.weather ? `${weatherIcon(sel.weather.code)} ${sel.weather.tMax}°C on shoot day` : weatherChipHtml(sel.dateISO)}</span></h2>
    <p class="muted">Only shooters who were in this session can log a count. Already-logged names show a ✓ — logging again overwrites your previous entry.</p>
    <label>Your name</label>
    <select id="bagName"><option value="">— Select your name —</option>${nameOpts}</select>
    <label class="session-option" style="margin-top:8px">
      <input type="checkbox" id="didNotShootChk" ${wasNotShooting?"checked":""}>
      <div class="meta"><div class="sday">I did not shoot this session</div><div class="sdate">Excludes you from the season stats entirely</div></div>
    </label>
    <div id="bagCountFields" style="display:${wasNotShooting?"none":"block"}">
      ${state.species.length===0 ? `<p class="muted">No species set up yet — ask the admin to add some under Setup.</p>` : `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">${speciesInputs}</div>
      `}
    </div>
    <div class="btn-row"><button class="btn-primary" id="submitBag" style="width:100%">Save</button></div>
  </div>` : ""}

  ${standCard}

  <div class="card">
    <h2>Results <span class="muted" style="font-weight:400;font-size:13px">· ${sel.weather ? `${weatherIcon(sel.weather.code)} ${sel.weather.tMax}°C` : weatherChipHtml(sel.dateISO)}</span></h2>
    <select id="resultsSessionSel">${options}</select>
    <div class="muted" style="margin:10px 0 4px">${isLocked?'Final — locked':'Draft — not yet locked'}</div>
    <table>
      <thead><tr><th>#</th><th>Shooter</th><th>Property</th><th>Stand</th><th>Birds</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="btn-row"><button class="btn-ghost" id="exportCsv" style="width:100%">Export CSV</button></div>
  </div>`;
}
async function submitBag(){
  const sel = state.sessions[state.resultsSessionId];
  if(!sel) return;
  const name = document.getElementById("bagName").value;
  if(!name){ toast("Select your name first."); return; }
  const didNotShoot = !!document.getElementById("didNotShootChk")?.checked;
  // Re-fetch fresh so we don't clobber someone else's just-logged count
  const fresh = await sget("session:"+sel.id);
  const target = fresh || sel;
  target.bags = target.bags || {};
  target.notShooting = target.notShooting || {};
  if(didNotShoot){
    delete target.bags[name];
    target.notShooting[name] = true;
    await saveSession(target);
    toast(`Marked ${name.split(" (")[0]} as did not shoot — excluded from stats.`);
  } else {
    delete target.notShooting[name];
    const counts = {};
    document.querySelectorAll(".bagInput").forEach(inp=>{
      const n = parseInt(inp.value, 10);
      if(n && n>0) counts[inp.dataset.species] = n;
    });
    target.bags[name] = counts;
    // Stamp the actual weather for this shoot day, once, the first time anyone logs a bag
    if(!target.weather){
      const w = await fetchWeatherForDate(target.dateISO);
      if(w) target.weather = w;
    }
    await saveSession(target);
    toast(`Saved bag count for ${name.split(" (")[0]}.`);
  }
  state.selectedBagName = "";
  render();
}
async function updateOwnStand(){
  const sel = state.sessions[state.resultsSessionId];
  if(!sel) return;
  const name = document.getElementById("standName").value;
  if(!name){ toast("Select a name first."); return; }
  const propSel = document.getElementById("resultsStandProp");
  const standSel = document.getElementById("resultsStandStand");
  const prop = propSel ? propSel.value : "";
  const stand = standSel ? standSel.value : "";
  if(!prop || !stand){ toast("Pick both a property and a stand."); return; }
  const fresh = await sget("session:"+sel.id);
  const target = fresh || sel;
  target.assignments = target.assignments || {};
  target.assignments[name] = {property: prop, stand: stand};
  await saveSession(target);
  toast(`Updated ${name.split(" (")[0]}'s stand to ${prop} · Stand ${stand}.`);
  state.selectedStandName = name;
  render();
}
async function releaseStand(){
  const sel = state.sessions[state.resultsSessionId];
  if(!sel) return;
  const name = document.getElementById("standName").value;
  if(!name){ toast("Select a name first."); return; }
  const fresh = await sget("session:"+sel.id);
  const target = fresh || sel;
  target.assignments = target.assignments || {};
  if(!target.assignments[name]){ toast("No stand currently assigned to release."); return; }
  if(!confirm(`Release ${name.split(" (")[0]}'s stand back into the pool? Any hunter can grab it after this — first come, first served.`)) return;
  delete target.assignments[name];
  await saveSession(target);
  toast(`Released ${name.split(" (")[0]}'s stand back to the pool.`);
  state.selectedStandName = name;
  render();
}
function exportCsv(){
  const sel = state.sessions[state.resultsSessionId];
  if(!sel) return;
  const bags = sel.bags || {};
  const notShooting = sel.notShooting || {};
  let csv = "Order,Shooter,Property,Stand,Birds,Species Breakdown,Weekend,Day,Date\n";
  sel.order.forEach((name,i)=>{
    const a = (sel.assignments||{})[name] || {};
    const didNotShoot = !!notShooting[name];
    const counts = bags[name];
    const total = didNotShoot ? "Did not shoot" : bagTotal(counts);
    const breakdown = didNotShoot ? "" : bagBreakdown(counts).replace(/"/g,'""');
    csv += `${i+1},"${name.replace(/"/g,'""')}",${a.property||""},${a.stand||""},${total},"${breakdown}",${sel.weekendLabel},${sel.day},${sel.dateISO}\n`;
  });
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${sel.weekendLabel}_${sel.day}_draw.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ---------- DASHBOARD TAB — Stats Explorer (v2) ----------
// Historic shot reports (none loaded yet for Wanderers — the club's past
// seasons can be appended here later). Format per record:
// [dateISO, day, weekendLabel, shooter, property, stand, baldpate, whitewing, peadove, didNotShoot, estimated]
// estimated=1 marks 2024 records whose bag counts were never recorded in the
// workbook — they carry the historical average for that property/stand instead.
// Live results logged in this app are layered on top automatically — where the
// same shooter/session exists in both, the app's logged bag takes precedence.
const HISTORIC_STATS = [];

function normSpecies(sp){
  sp = String(sp).toUpperCase().trim();
  if(sp === "PEA DOVE") return "PALOMA"; // workbook "Pea Dove" column = app species PALOMA
  return sp;
}
function allStatRecords(){
  // The workbook can legitimately hold the same shooter twice in one session
  // (two stands, or several guests under one label), so records are kept as a
  // list — never collapsed by key. A key is only used to let a bag logged in
  // the app REPLACE the matching workbook row(s) for that shooter/session.
  const histKeys = {};
  HISTORIC_STATS.forEach(r=>{ histKeys[`${r[0]}|${r[1]}|${r[3]}`] = true; });
  const liveOverride = {}; // key -> [live records replacing that shooter/session]
  const liveExtra = [];
  sessionsSorted().filter(s=>s.locked).forEach(s=>{
    const assignments = s.assignments||{}, bags = s.bags||{}, notShooting = s.notShooting||{};
    (s.order||[]).forEach(name=>{
      const key = `${s.dateISO}|${s.day}|${name}`;
      const logged = bags[name] !== undefined || notShooting[name];
      const counts = {};
      Object.entries(bags[name]||{}).forEach(([sp,n])=>{
        n = Number(n)||0;
        if(n>0){ const k = normSpecies(sp); counts[k] = (counts[k]||0)+n; }
      });
      const a = assignments[name];
      const rec = {date:s.dateISO, day:s.day, wk:s.weekendLabel, shooter:name, prop:a?a.property:"", stand:a?String(a.stand):"", counts, dns:!!notShooting[name], src:"live"};
      if(histKeys[key]){
        if(logged) (liveOverride[key] = liveOverride[key]||[]).push(rec);
        // not logged in the app — the workbook record stands
      } else {
        liveExtra.push(rec);
      }
    });
  });
  const out = [];
  const emitted = {};
  HISTORIC_STATS.forEach(r=>{
    const key = `${r[0]}|${r[1]}|${r[3]}`;
    if(liveOverride[key]){
      if(!emitted[key]){ liveOverride[key].forEach(x=>out.push(x)); emitted[key] = true; }
      return;
    }
    const counts = {};
    if(r[6]) counts["BALDPATE"] = r[6];
    if(r[7]) counts["WHITE WING"] = r[7];
    if(r[8]) counts["PALOMA"] = r[8];
    out.push({date:r[0], day:r[1], wk:r[2], shooter:r[3], prop:r[4], stand:String(r[5]||""), counts, dns:!!r[9], est:!!r[10], src:"hist"});
  });
  return out.concat(liveExtra);
}
function recTotal(r){ return Object.values(r.counts).reduce((a,b)=>a+b,0); }
function recYear(r){ return r.date.slice(0,4); }

function statsDefaults(){
  const recs = allStatRecords().filter(r=>!r.dns);
  if(recs.length===0) return {year:"ALL", wk:"ALL", prop:"ALL", stand:"ALL", shooter:"ALL"};
  const latest = recs.reduce((a,b)=> a.date>b.date ? a : b);
  return {year: recYear(latest), wk: latest.wk, prop:"ALL", stand:"ALL", shooter:"ALL"};
}
function filteredStats(){
  const f = state.statsFilter;
  return allStatRecords().filter(r=>{
    if(r.dns) return false;
    if(f.year!=="ALL" && recYear(r)!==f.year) return false;
    if(f.wk!=="ALL" && r.wk!==f.wk) return false;
    if(f.prop!=="ALL" && r.prop!==f.prop) return false;
    if(f.stand!=="ALL" && String(r.stand)!==f.stand) return false;
    if(f.shooter!=="ALL" && r.shooter!==f.shooter) return false;
    return true;
  });
}

function statBarListHtml(entries, unit){
  // entries: [[label, value]] sorted desc
  const max = entries.length ? entries[0][1] : 0;
  return entries.map(([name,val])=>{
    const pct = max>0 ? Math.round(val/max*100) : 0;
    return `<div style="margin-bottom:10px">
      <div class="row" style="margin-bottom:3px"><b style="flex:1;font-size:13px">${esc(String(name))}</b><span class="muted" style="flex:0 0 auto">${val}${unit||""}</span></div>
      <div style="background:var(--bg);border-radius:6px;overflow:hidden;height:9px;">
        <div style="background:var(--brass);width:${pct}%;height:100%;"></div>
      </div>
    </div>`;
  }).join("");
}
function svgColumnsHtml(pairs){
  if(pairs.length===0) return "";
  const W=560, H=190, pad=16;
  const step = (W-pad*2)/pairs.length;
  const bw = Math.min(70, step*0.62);
  const max = Math.max(1, ...pairs.map(p=>p[1]));
  const skip = pairs.length > 12 ? Math.ceil(pairs.length/12) : 1;
  let out = "";
  pairs.forEach(([lab,val],i)=>{
    const h = Math.round((H-64)*val/max);
    const x = pad + step*i + (step-bw)/2;
    const y = H-36-h;
    out += `<rect x="${x.toFixed(1)}" y="${y}" width="${bw.toFixed(1)}" height="${Math.max(h,2)}" rx="3" fill="#B08D57"/>`;
    if(pairs.length<=14) out += `<text x="${(x+bw/2).toFixed(1)}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="600" fill="#26362B" font-family="Inter,sans-serif">${val}</text>`;
    if(i % skip === 0) out += `<text x="${(x+bw/2).toFixed(1)}" y="${H-16}" text-anchor="middle" font-size="11" fill="#5B5E4F" font-family="Inter,sans-serif">${esc(String(lab))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">${out}</svg>`;
}
function fmtDateY(iso){
  if(!iso) return "";
  const d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"});
}
function wkSortKey(recs){
  // weekend label -> earliest date, for chronological ordering
  const m = {};
  recs.forEach(r=>{ if(!(r.wk in m) || r.date < m[r.wk]) m[r.wk] = r.date; });
  return m;
}

function renderDashboard(){
  if(!state.statsFilter) state.statsFilter = statsDefaults();
  const f = state.statsFilter;
  const all = allStatRecords().filter(r=>!r.dns);

  // ---- filter option pools (scoped progressively) ----
  const years = Array.from(new Set(all.map(recYear))).sort().reverse();
  const inYear = all.filter(r=> f.year==="ALL" || recYear(r)===f.year);
  const wkKeys = wkSortKey(inYear);
  const weekends = Array.from(new Set(inYear.map(r=>r.wk))).sort((a,b)=> (wkKeys[a]||"").localeCompare(wkKeys[b]||""));
  const inWk = inYear.filter(r=> f.wk==="ALL" || r.wk===f.wk);
  const props = Array.from(new Set(inWk.map(r=>r.prop).filter(Boolean))).sort();
  const inProp = inWk.filter(r=> f.prop==="ALL" || r.prop===f.prop);
  const stands = f.prop==="ALL" ? [] : Array.from(new Set(inProp.map(r=>String(r.stand)).filter(Boolean)))
    .sort((a,b)=> (parseInt(a,10)||999)-(parseInt(b,10)||999) || a.localeCompare(b));
  const shooters = Array.from(new Set(inWk.map(r=>r.shooter))).sort();

  const opt = (val, cur, label) => `<option value="${escAttr(val)}" ${val===cur?"selected":""}>${esc(label!==undefined?label:val)}</option>`;
  const filterCard = `
  <div class="card">
    <h2>Stats explorer</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 10px">
      <div><label>Year</label><select class="statsFilter" data-f="year">${opt("ALL",f.year,"All years")}${years.map(y=>opt(y,f.year)).join("")}</select></div>
      <div><label>Weekend</label><select class="statsFilter" data-f="wk">${opt("ALL",f.wk,"All weekends")}${weekends.map(w=>opt(w,f.wk)).join("")}</select></div>
      <div><label>Property</label><select class="statsFilter" data-f="prop">${opt("ALL",f.prop,"All properties")}${props.map(p=>opt(p,f.prop)).join("")}</select></div>
      <div><label>Stand</label><select class="statsFilter" data-f="stand" ${f.prop==="ALL"?"disabled":""}>${opt("ALL",f.stand, f.prop==="ALL"?"Pick a property first":"All stands")}${stands.map(s=>opt(s,f.stand)).join("")}</select></div>
    </div>
    <label>Shooter</label>
    <select class="statsFilter" data-f="shooter">${opt("ALL",f.shooter,"All shooters")}${shooters.map(s=>opt(s,f.shooter)).join("")}</select>
    <div class="btn-row">
      <button class="btn-ghost btn-small" id="statsLatest">Latest weekend</button>
      <button class="btn-ghost btn-small" id="statsReset">All-time view</button>
    </div>
  </div>`;

  const recs = filteredStats();
  const withBirds = recs.filter(r=>recTotal(r)>0);
  const total = withBirds.reduce((a,r)=>a+recTotal(r),0);
  const uniqShooters = new Set(recs.map(r=>r.shooter)).size;
  const sessions = new Set(recs.map(r=>`${r.date}|${r.day}`)).size;
  const best = withBirds.filter(r=>!r.est).slice().sort((a,b)=>recTotal(b)-recTotal(a))[0];
  const hasEst = recs.some(r=>r.est);

  if(recs.length===0){
    return filterCard + `<div class="card"><div class="empty">No shot reports match this selection.<br>Widen the filters above.</div></div>`;
  }

  const bySpecies = {};
  withBirds.forEach(r=>Object.entries(r.counts).forEach(([sp,n])=>{ bySpecies[sp]=(bySpecies[sp]||0)+n; }));
  const speciesRows = Object.entries(bySpecies).sort((a,b)=>b[1]-a[1])
    .map(([sp,n])=>`<div class="list-row"><span>${esc(sp)}</span><span><b>${n}</b></span></div>`).join("");

  const summaryCard = `
  <div class="card">
    <h2>${f.wk!=="ALL" ? esc(f.wk)+" · " : ""}${f.year!=="ALL" ? esc(f.year) : "All seasons"}${f.prop!=="ALL" ? " · "+esc(f.prop) : ""}${f.stand!=="ALL" ? " · Stand "+esc(f.stand) : ""}${f.shooter!=="ALL" ? " · "+esc(f.shooter) : ""}</h2>
    <div class="stat-box">
      <div class="s"><div class="n">${hasEst?"~":""}${total}</div><div class="l">Birds</div></div>
      <div class="s"><div class="n">${uniqShooters}</div><div class="l">Shooters</div></div>
      <div class="s"><div class="n">${sessions}</div><div class="l">Sessions</div></div>
    </div>
    ${best ? `<p class="muted" style="margin:8px 0 0">Best single bag: <b>${esc(best.shooter)}</b> — ${recTotal(best)} birds${best.prop?` at ${esc(best.prop)}${best.stand?` · Stand ${esc(best.stand)}`:""}`:""} (${fmtDate(best.date)})</p>` : ""}
    ${speciesRows ? `<div class="section-divider">By species</div>${speciesRows}` : ""}
    ${hasEst ? `<p class="muted" style="margin:10px 0 0;font-size:12px">~ Includes 2024 estimates: bag counts weren't recorded that season, so each 2024 entry carries the historical average for its property &amp; stand — a rough indicator, not actuals.</p>` : ""}
  </div>`;

  // ---- trend chart: adapts to the zoom level ----
  let trendTitle, trendPairs;
  if(f.year==="ALL"){
    trendTitle = "Birds by year";
    const byYear = {};
    withBirds.forEach(r=>{ byYear[recYear(r)]=(byYear[recYear(r)]||0)+recTotal(r); });
    trendPairs = Object.entries(byYear).sort((a,b)=>a[0].localeCompare(b[0]));
  } else if(f.wk==="ALL"){
    trendTitle = `Birds by weekend — ${f.year}`;
    const byWk = {};
    withBirds.forEach(r=>{ byWk[r.wk]=(byWk[r.wk]||0)+recTotal(r); });
    const keys = wkSortKey(withBirds);
    trendPairs = Object.entries(byWk).sort((a,b)=> (keys[a[0]]||"").localeCompare(keys[b[0]]||""))
      .map(([w,n])=>[w.replace(/\s/g,""), n]);
  } else {
    trendTitle = `Birds by session — ${f.wk}`;
    const byDay = {};
    withBirds.forEach(r=>{ byDay[r.day]=(byDay[r.day]||0)+recTotal(r); });
    const order = ["SATAM","SATPM","SUNAM","SUNPM"];
    trendPairs = order.filter(d=>byDay[d]).map(d=>[dayLabel(d), byDay[d]]);
  }
  const trendCard = trendPairs.length>1 ? `<div class="card"><h2>${trendTitle}</h2>${svgColumnsHtml(trendPairs)}</div>` : "";

  // ---- breakdown: by property, or by stand once a property is chosen ----
  let breakdownCard = "";
  if(f.prop==="ALL"){
    const byProp = {};
    withBirds.forEach(r=>{ const p=r.prop||"(no stand recorded)"; byProp[p]=(byProp[p]||0)+recTotal(r); });
    const entries = Object.entries(byProp).sort((a,b)=>b[1]-a[1]);
    if(entries.length) breakdownCard = `<div class="card"><h2>Top properties</h2>${statBarListHtml(entries)}</div>`;
  } else {
    const bySt = {};
    withBirds.forEach(r=>{ const s=r.stand||"?"; bySt[s]=(bySt[s]||0)+recTotal(r); });
    const entries = Object.entries(bySt).sort((a,b)=>b[1]-a[1]).map(([s,n])=>["Stand "+s, n]);
    if(entries.length) breakdownCard = `<div class="card"><h2>Stands at ${esc(f.prop)}</h2>${statBarListHtml(entries)}${PROPERTY_MAPS[f.prop] ? propertyMapsRowHtml([f.prop]) : ""}</div>`;
  }

  // ---- shooters: leaderboard, or one shooter's session log ----
  let shooterCard = "";
  if(f.shooter==="ALL"){
    const bySh = {};
    withBirds.forEach(r=>{ bySh[r.shooter]=(bySh[r.shooter]||0)+recTotal(r); });
    const entries = Object.entries(bySh).sort((a,b)=>b[1]-a[1]).slice(0,15);
    if(entries.length) shooterCard = `<div class="card"><h2>Top shooters</h2>${statBarListHtml(entries)}</div>`;
  } else {
    const rows = recs.slice().sort((a,b)=> b.date.localeCompare(a.date) || a.day.localeCompare(b.day))
      .map(r=>`<tr><td style="white-space:nowrap">${fmtDateY(r.date)}</td><td>${dayLabel(r.day)} · ${esc(r.wk)}</td><td>${esc(r.prop||"—")}${r.stand?` · ${esc(r.stand)}`:""}</td><td><b>${r.est?"~":""}${recTotal(r)||"—"}</b></td></tr>`).join("");
    shooterCard = `<div class="card"><h2>${esc(f.shooter)} — session log</h2>
      <table><thead><tr><th>Date</th><th>Session</th><th>Property · Stand</th><th>Birds</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // ---- season log: one row per session in the current selection ----
  const sessMap = {};
  recs.forEach(r=>{
    const k = `${r.date}|${r.day}`;
    if(!sessMap[k]) sessMap[k] = {date:r.date, day:r.day, wk:r.wk, shooters:0, birds:0, est:false};
    sessMap[k].shooters += 1;
    sessMap[k].birds += recTotal(r);
    if(r.est) sessMap[k].est = true;
  });
  const sessList = Object.values(sessMap).sort((a,b)=> b.date.localeCompare(a.date) || b.day.localeCompare(a.day));
  const LOG_CAP = 30;
  const shownSess = sessList.slice(0, LOG_CAP);
  const liveWeather = {};
  sessionsSorted().forEach(s=>{ if(s.weather) liveWeather[`${s.dateISO}|${s.day}`] = s.weather; });
  const logRows = shownSess.map(s=>{
    const w = liveWeather[`${s.date}|${s.day}`];
    const wHtml = w ? `${weatherIcon(w.code)} ${w.tMax}\u00b0C` : weatherChipHtml(s.date, s.day);
    return `<tr><td style="white-space:nowrap">${fmtDateY(s.date)}</td><td>${dayLabel(s.day)} \u00b7 ${esc(s.wk)}</td><td>${s.shooters}</td><td style="white-space:nowrap">${wHtml}</td><td><b>${s.est?"~":""}${s.birds}</b></td></tr>`;
  }).join("");
  const seasonLogCard = sessList.length ? `<div class="card"><h2>Season log</h2>
    ${sessList.length > LOG_CAP ? `<p class="muted">Most recent ${LOG_CAP} of ${sessList.length} sessions \u2014 narrow the filters above to see earlier ones.</p>` : ""}
    <table><thead><tr><th>Date</th><th>Session</th><th>Shooters</th><th>Weather</th><th>Birds</th></tr></thead><tbody>${logRows}</tbody></table>
  </div>` : "";

  const exportCard = `<div class="card">
    <p class="muted">Exports exactly what the filters above are showing — one row per shooter per session, live app results merged with the historic workbook (app results win where both exist).</p>
    <div class="btn-row"><button class="btn-ghost" id="exportSeasonCsv" style="width:100%">Export filtered CSV (${recs.length} rows)</button></div>
  </div>`;

  return filterCard + summaryCard + trendCard + breakdownCard + shooterCard + seasonLogCard + exportCard;
}

function exportSeasonCsv(){
  const recs = filteredStats().slice().sort((a,b)=> a.date.localeCompare(b.date) || a.day.localeCompare(b.day) || a.shooter.localeCompare(b.shooter));
  let csv = "Date,Weekend,Session,Shooter,Property,Stand,Total,Breakdown,Source\n";
  recs.forEach(r=>{
    const breakdown = Object.entries(r.counts).map(([sp,n])=>`${sp} ${n}`).join(" · ");
    csv += `${r.date},${r.wk},${dayLabel(r.day)},"${r.shooter.replace(/"/g,'""')}","${(r.prop||"").replace(/"/g,'""')}",${r.stand||""},${recTotal(r)},"${breakdown}",${r.est?"Estimated (2024 stand avg)":(r.src==="live"?"App":"Workbook")}\n`;
  });
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `WGC_stats_export.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function createSessions(){
  const label = document.getElementById("newWeekendLabel").value.trim();
  const dateStr = document.getElementById("newWeekendDate").value;
  if(!label || !dateStr){ toast("Enter a weekend label and Saturday's date."); return; }
  const wantSatAM = document.getElementById("chkSatAM").checked;
  const wantSatPM = document.getElementById("chkSatPM").checked;
  const wantSunAM = document.getElementById("chkSunAM").checked;
  const picks = [];
  if(wantSatAM) picks.push({key:"SATAM", offset:0});
  if(wantSatPM) picks.push({key:"SATPM", offset:0});
  if(wantSunAM) picks.push({key:"SUNAM", offset:1});
  if(picks.length===0){ toast("Pick at least one session."); return; }

  const availableProperties = Array.from(document.querySelectorAll(".newWeekendPropChk:checked")).map(c=>c.value);
  if(availableProperties.length===0){ toast("Pick at least one available property for this weekend."); return; }

  for(const p of picks){
    const d = new Date(dateStr+"T12:00:00");
    d.setDate(d.getDate()+p.offset);
    const dISO = d.toISOString().slice(0,10);
    const id = `${label.replace(/[^a-z0-9]/gi,'').toLowerCase()}-${p.key.toLowerCase()}-${dISO}`;
    const session = {
      id, weekendLabel: label, day: p.key, dateISO: dISO,
      active: true, forceOpen: false, registrations: [], order: [], assignments: {}, bags: {}, drawnAt: null, locked: false, rollCallLocked: false,
      availableProperties, guestsAllowed: false
    };
    await saveSession(session);
    if(!state.sessionIndex.includes(id)) state.sessionIndex.push(id);
  }
  await sset("session-index", state.sessionIndex);
  toast(`Created ${picks.length} session(s) for ${label}.`);
  render();
}
async function toggleActive(id){
  const s = state.sessions[id];
  const status = sessionStatus(s);
  if(status === "open"){
    s.active = false;
    s.forceOpen = false;
    toast(`Closed registration for ${dayLabel(s.day)} · ${s.weekendLabel}.`);
  } else if(status === "auto-closed"){
    s.forceOpen = true;
    toast(`Reopened ${dayLabel(s.day)} · ${s.weekendLabel} for late requests.`);
  } else { // "closed"
    s.active = true;
    s.forceOpen = true;
    toast(`Opened registration for ${dayLabel(s.day)} · ${s.weekendLabel}.`);
  }
  await saveSession(s);
  render();
}
async function clearAllSessions(){
  const ids = state.sessionIndex.slice();
  if(ids.length===0){ toast("No sessions to delete."); return; }
  const typed = prompt(`This will permanently delete all ${ids.length} session(s) — every registration, draw, and bag count. Roster/properties/species are untouched.\n\nType DELETE to confirm.`);
  if(typed !== "DELETE"){ toast("Cancelled — nothing deleted."); return; }
  for(const id of ids){
    await apiCall("delete", {key: "session:"+id, pin: state.adminPin || ""});
    delete state.sessions[id];
  }
  state.sessionIndex = [];
  await sset("session-index", []);
  toast(`Deleted ${ids.length} session(s). Ready for a fresh season.`);
  render();
}
async function rebuildSessionIndex(){
  if(!confirm("Rescan the spreadsheet for session records and rebuild the list? This won't delete or change any session's data, only reconnect the app to what's actually on the sheet.")) return;
  const r = await apiCall("list", {prefix: "session:"});
  if(!r || r.error || !r.keys){
    toast("⚠️ Couldn't reach the shared database — try again.");
    return;
  }
  const ids = r.keys.map(k=>k.slice("session:".length));
  state.sessionIndex = ids;
  await sset("session-index", ids);
  await loadAllSessions();
  toast(`Found and relinked ${ids.length} session(s). Review the list below and delete any you don't need.`);
  render();
}
async function deleteSession(id){
  if(!confirm("Delete this session and its registrations? This can't be undone.")) return;
  state.sessionIndex = state.sessionIndex.filter(x=>x!==id);
  delete state.sessions[id];
  await sset("session-index", state.sessionIndex);
  await apiCall("delete", {key: "session:"+id, pin: state.adminPin || ""}); // actually remove the row, not just unlist it
  render();
}

async function renameMember(oldName){
  const input = window.prompt("Correct spelling for this member:", oldName);
  if(input === null) return; // cancelled
  const newName = input.trim().toUpperCase();
  if(!newName || newName === oldName) return;
  if(state.roster.some(m => m.name === newName)){
    toast(`"${newName}" already exists on the roster — can't rename to a duplicate.`);
    return;
  }
  const member = state.roster.find(m => m.name === oldName);
  if(!member) return;
  member.name = newName;
  await sset("roster", state.roster);

  // Cascade the fix into any session that already references the old spelling
  let touched = 0;
  for(const id of state.sessionIndex){
    const s = state.sessions[id];
    if(!s) continue;
    let changed = false;
    if(s.registrations && s.registrations.includes(oldName)){
      s.registrations = s.registrations.map(n => n===oldName ? newName : n);
      changed = true;
    }
    if(s.order && s.order.includes(oldName)){
      s.order = s.order.map(n => n===oldName ? newName : n);
      changed = true;
    }
    if(s.assignments && Object.prototype.hasOwnProperty.call(s.assignments, oldName)){
      s.assignments[newName] = s.assignments[oldName];
      delete s.assignments[oldName];
      changed = true;
    }
    if(changed){
      await sset("session:"+id, s);
      touched++;
    }
  }
  toast(`Renamed "${oldName}" → "${newName}"${touched ? ` and updated ${touched} session${touched>1?"s":""}` : ""}.`);
  render();
}

function dayLabel(day){
  return day==='SATAM' ? 'Sat AM' : day==='SATPM' ? 'Sat PM' : 'Sun AM';
}
function buildWeeklyMessage(){
  const open = sessionsSorted().filter(s=>s.active && !(s.order&&s.order.length));
  if(open.length===0) return null;
  const byWeekend = {};
  open.forEach(s=>{ (byWeekend[s.weekendLabel] = byWeekend[s.weekendLabel] || []).push(s); });
  const lines = [`Wanderers Gun Club — Draw Registration`, ``];
  Object.keys(byWeekend).forEach(wk=>{
    const sess = byWeekend[wk].slice().sort((a,b)=>a.dateISO.localeCompare(b.dateISO));
    const parts = sess.map(s=>`${dayLabel(s.day)} (${fmtDate(s.dateISO)})`).join(' · ');
    lines.push(`${wk}: ${parts}`);
  });
  lines.push(``, `Tap below and let us know which sessions you're shooting:`, window.location.href, ``, `Registration closes once the draw is run for each session — don't wait!`);
  return lines.join('\n');
}
function fallbackCopy(text){
  const ta = document.getElementById("waMsgBox");
  if(ta){
    ta.focus(); ta.select();
    try{ document.execCommand('copy'); toast("Copied — paste into WhatsApp."); }
    catch(e){ toast("Couldn't auto-copy — tap the text above, select all, and copy manually."); }
  } else {
    toast("Couldn't auto-copy — tap the text above, select all, and copy manually.");
  }
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=>toast("Copied — paste into WhatsApp."),
      ()=>fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

async function downloadQr(){
  const img = document.getElementById('qrImg');
  if(!img) return;
  try{
    const resp = await fetch(img.src, {mode:'cors'});
    const blob = await resp.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl; a.download = 'wanderers-field-register-qr.png';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(objUrl);
  }catch(e){
    window.open(img.src, '_blank');
    toast('Opened the QR in a new tab — long-press or right-click to save it.');
  }
}

function attachHandlers(){
  const regName = document.getElementById("regName");
  if(regName){
    regName.addEventListener("change", ()=>{
      state.selectedRegName = regName.value;
      render();
    });
  }
  document.querySelectorAll(".session-option[data-session]").forEach(opt=>{
    opt.addEventListener("click", (e)=>{
      if(e.target.tagName !== "INPUT"){
        const cb = opt.querySelector("input");
        cb.checked = !cb.checked;

function saveBootstrapCache(core){ try{ localStorage.setItem("wgc-bootstrap-cache", JSON.stringify(core)); }catch(e){} }
function readBootstrapCache(){ try{ const raw = localStorage.getItem("wgc-bootstrap-cache"); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
document.addEventListener("click", (e)=>{ if(e.target.closest(".offline-banner")) location.reload(); });

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

// Live refresh: while viewing Draw or Results, quietly re-pull the selected
// session so stand claims and bag logs appear without a manual reload.
const LIVE_REFRESH_MS = 25000;
async function liveRefreshTick(){
  if(document.visibilityState !== "visible") return;
  if(!state.loaded || state.offlineMode) return;
  if(state.tab !== "draw" && state.tab !== "results") return;
  const el = document.activeElement;
  if(el && (el.tagName === "SELECT" || el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return;
  const partial = Array.from(document.querySelectorAll(".propSel,.standSel,#resultsStandProp,#resultsStandStand")).some(s=>s.value);
  if(partial) return; // someone is mid-assignment on this screen — don't wipe their picks
  const id = state.tab === "draw" ? state.drawSessionId : state.resultsSessionId;
  if(!id) return;
  const fresh = await sget("session:"+id);
  if(!fresh) return;
  if(JSON.stringify(fresh) !== JSON.stringify(state.sessions[id])){
    state.sessions[id] = fresh;
    render();
  }
}
setInterval(liveRefreshTick, LIVE_REFRESH_MS);
window.__liveRefreshTick = liveRefreshTick; // test hook

init();
